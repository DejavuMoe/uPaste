name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (vMAJOR.MINOR.PATCH[-prerelease])'
        required: true
        type: string

# Validation never needs write access. Only the publish-draft job elevates to
# contents: write, and only for a real v* tag push.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile

      - name: Resolve and validate version metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$TAG_NAME"
          else
            version="$DISPATCH_VERSION"
          fi
          source ./scripts/release-lib.sh
          if ! release_version_is_valid "$version"; then
            echo "Refusing to package malformed version: $version" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow requires a v* tag on push" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Enforce tag and commit integrity
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$VERSION" ]] || { echo "tag $GITHUB_REF_NAME != version $VERSION" >&2; exit 1; }
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          [[ "$tag_commit" == "$COMMIT" ]] || { echo "tag commit $tag_commit != build commit $COMMIT" >&2; exit 1; }

      - name: Run complete deterministic pre-release qualification
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: ./scripts/qualify-release.sh "$VERSION" "$RUNNER_TEMP/upaste-release"

  publish-draft:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile

      - name: Rebuild deterministic packages for publication
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$COMMIT") ./scripts/package-release.sh "$VERSION"

      - name: Verify package integrity before publication
        run: ./scripts/verify-release.sh "$VERSION"

      - name: Enforce tag and commit integrity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$VERSION" ]] || { echo "tag $GITHUB_REF_NAME != version $VERSION" >&2; exit 1; }
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          [[ "$tag_commit" == "$COMMIT" ]] || { echo "tag commit $tag_commit != build commit $COMMIT" >&2; exit 1; }

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --json isDraft --jq '.isDraft' >"$RUNNER_TEMP/draft-state" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/draft-state")" != "true" ]]; then
              echo "Refusing to modify published release $VERSION" >&2
              exit 1
            fi
            gh release upload "$VERSION" release/*.tar.gz release/SHA256SUMS --clobber
          else
            gh release create "$VERSION" \
              --draft \
              --title "uPaste $VERSION" \
              --notes "Draft release prepared by .github/workflows/release.yml for uPaste $VERSION. Review artifacts and notes before publishing." \
              release/*.tar.gz release/SHA256SUMS
          fi
