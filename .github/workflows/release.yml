name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (vMAJOR.MINOR.PATCH[-prerelease])'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile

      - name: Resolve and validate version metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$TAG_NAME"
          else
            version="$DISPATCH_VERSION"
          fi
          source ./scripts/release-lib.sh
          if ! release_version_is_valid "$version"; then
            echo "Refusing to package malformed version: $version" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Release workflow requires a v* tag on push" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify source and deployment contract
        run: |
          go test ./...
          ./scripts/check-deployment.sh

      - name: Build deterministic release packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct "$COMMIT")
          SOURCE_DATE_EPOCH="$epoch" ./scripts/package-release.sh "$VERSION"

      - name: Verify packages, runtime, and deterministic rebuild
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: ./scripts/verify-release.sh "$VERSION"

      - name: Enforce tag and commit integrity
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "$VERSION" ]] || { echo "tag $GITHUB_REF_NAME != version $VERSION" >&2; exit 1; }
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          [[ "$tag_commit" == "$COMMIT" ]] || { echo "tag commit $tag_commit != build commit $COMMIT" >&2; exit 1; }

      - name: Create draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "uPaste $VERSION" \
            --notes "Draft release prepared by .github/workflows/release.yml for uPaste $VERSION. Review artifacts and notes before publishing." \
            release/*.tar.gz release/SHA256SUMS
